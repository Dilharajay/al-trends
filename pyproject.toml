[project]
name = "zscore-extractor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.0.5",
    "pdfplumber>=0.11.10",
    "pyarrow>=25.0.1",
    "pymupdf>=1.28.2",
    "streamlit>=1.32.0",
    "plotly>=5.19.0",
    "matplotlib>=3.11.1",
    "zenml[local]>=0.96.3",
    "scikit-learn>=1.9.0",
]

[project.scripts]
zscore-extractor = "zscore_extractor.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
